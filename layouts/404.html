{{- define "main" }}

<main class="bl-scope">
  <article class="bl-post bl-post-404">

    <header class="bl-post-head" style="text-align: center; padding-top: 64px;">
      <div class="bl-post-folio" style="justify-content: center;">
        <span class="folio-mark">Erratum</span>
        <span class="folio-sep">·</span>
        <span>MMXXVI · 失落的章节</span>
      </div>
      <h1 class="bl-post-title bl-post-title--xl" style="font-size: clamp(96px, 18vw, 220px); line-height: 1; margin: 16px 0;">
        4<span style="font-style: italic; color: var(--bl-accent);">0</span>4
      </h1>
      <p class="bl-post-deck" style="text-align: center; max-width: 480px; margin: 0 auto;">
        这一页被风翻走了，或者从未存在过。<br>
        回到 <a href="/posts/" style="color: var(--bl-accent); border-bottom: 1px solid currentColor;">所有笔记</a>
        或 <a href="/qurious/" style="color: var(--bl-accent); border-bottom: 1px solid currentColor;">Qurious 周刊</a>。
      </p>
    </header>

    <div style="text-align: center; margin: 48px 0;">
      <div style="display: inline-block; font-family: var(--bl-serif); font-style: italic; color: var(--bl-faded); font-size: 18px;">
        — Fin —
      </div>
    </div>

  </article>
</main>

{{- end }}
